[project]
name = "restaurant-independent-study"
version = "0.2.0"
description = "Synthetic restaurant operations learning platform"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "duckdb>=1.1,<2", "dbt-duckdb>=1.9,<2", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "streamlit>=1.40,<2", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
